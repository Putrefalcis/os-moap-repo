# track-alpine: the wasm32-wasip1 port follows Alpine.
#
# This repo is self-contained (recipes + busybox + packers + mirror), so the job
# builds and publishes from its OWN checkout with the default GITHUB_TOKEN -- no
# cross-repo secret / PAT. Weekly (or on dispatch) it parses Alpine's APKINDEX as a
# VERSION ORACLE (never a binary source -- Alpine ships no wasm arch), rebuilds any
# port whose upstream version bumped, smoke-permitting-publishes, and commits the
# blob. A build failure opens an issue and the old version keeps serving.
#
# The CI build is BUILD-ONLY (the WASI shim that runs the smoke lives in the private
# product repo). Smoke new versions locally: `tools/ci_build.sh <name> <ver>` there.
name: track-alpine
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'package name: rebuild+publish even without an Alpine bump'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      FORCE: ${{ inputs.force || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: version oracle (Alpine APKINDEX) -> bump list
        id: oracle
        run: |
          python3 - <<'EOF'
          import json, os, re, tarfile, urllib.request, io

          ports = json.load(open('tools/ports.json'))
          ours = {p['name']: p['ver'] for p in json.load(open('APKINDEX.json'))['pkgs']}
          force = os.environ.get('FORCE', '')

          def vercmp(a, b):  # mirror of tools/pack_repo.py
              sa, sb = re.split(r'[.\-]', a), re.split(r'[.\-]', b)
              for i in range(max(len(sa), len(sb))):
                  x = sa[i] if i < len(sa) else ''
                  y = sb[i] if i < len(sb) else ''
                  if x == y: continue
                  if x.isdigit() and y.isdigit(): return -1 if int(x) < int(y) else 1
                  return -1 if x < y else 1
              return 0

          def upstream(v):  # strip our -rN packaging revision
              return re.sub(r'-r\d+$', '', v)

          bumps = []
          for name, cfg in ports.items():
              if name.startswith('_'): continue
              url = (f"https://dl-cdn.alpinelinux.org/alpine/{cfg['branch']}"
                     f"/{cfg['repo']}/x86_64/APKINDEX.tar.gz")
              data = urllib.request.urlopen(url, timeout=60).read()
              with tarfile.open(fileobj=io.BytesIO(data)) as t:
                  text = t.extractfile('APKINDEX').read().decode()
              m = re.search(rf"^P:{re.escape(cfg['alpine'])}\nV:([^\n]+)", text, re.M)
              if not m:
                  print(f"::warning::{name}: {cfg['alpine']} not in Alpine {cfg['branch']}/{cfg['repo']}")
                  continue
              alpine_up = upstream(m.group(1))
              our_up = upstream(ours.get(name, '0'))
              print(f"{name}: alpine {alpine_up}  ours {our_up}")
              if name == force or vercmp(alpine_up, our_up) > 0:
                  bumps.append({'name': name, 'ver': alpine_up})
          if force and not any(b['name'] == force for b in bumps):
              bumps.append({'name': force, 'ver': upstream(ours.get(force, '0'))})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"bumps={json.dumps(bumps)}\n")
          print('bumps:', bumps)
          EOF

      - name: install wasi-sdk
        if: steps.oracle.outputs.bumps != '[]'
        run: |
          SDK_VER=33
          curl -fsSL -o /tmp/sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$SDK_VER/wasi-sdk-$SDK_VER.0-x86_64-linux.tar.gz"
          mkdir -p build
          tar xzf /tmp/sdk.tar.gz -C build
          mv build/wasi-sdk-$SDK_VER.0-x86_64-linux build/wasi-sdk
          sudo apt-get install -y ncurses-term
          cp /usr/share/terminfo/x/xterm guest/pkgs/terminfo-xterm 2>/dev/null || \
            cp /lib/terminfo/x/xterm guest/pkgs/terminfo-xterm

      - name: rebuild bumped ports + publish
        if: steps.oracle.outputs.bumps != '[]'
        run: |
          set -uo pipefail
          bash guest/build.sh                       # busybox + libwasicompat (recipes link it)
          FAILED=0
          for row in $(echo '${{ steps.oracle.outputs.bumps }}' | python3 -c "import json,sys; [print(b['name']+'='+b['ver']) for b in json.load(sys.stdin)]"); do
            NAME="${row%%=*}"; VER="${row##*=}"
            echo "=== $NAME $VER ==="
            if bash tools/ci_build.sh "$NAME" "$VER"; then   # build-only (shim is private)
              DESC=$(python3 -c "import json; d=json.load(open('APKINDEX.json')); print(next((p['desc'] for p in d['pkgs'] if p['name']=='$NAME'), '$NAME'))")
              python3 tools/pack_repo.py --repo . --name "$NAME" --ver "$VER-r0" \
                --desc "$DESC" --dir "guest/pkgs/$NAME/stage" \
                || { echo "::error::$NAME pack_repo failed"; FAILED=1; }
            else
              echo "::error::$NAME $VER build failed"; FAILED=1
            fi
          done
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"

      - name: commit + push published bumps
        if: steps.oracle.outputs.bumps != '[]'
        run: |
          git config user.name 'os-moap-tracker'
          git config user.email 'tracker@os-moap.invalid'
          git add -A
          git diff --cached --quiet && { echo "nothing published"; exit 0; }
          git commit -m "track-alpine: $(git diff --cached --name-only | grep tar.gz | tr '\n' ' ')"
          git push
          echo "published: $(git log -1 --oneline)" >> "$GITHUB_STEP_SUMMARY"

      - name: open issue on failure
        if: env.FAILED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            -t "track-alpine: port build failed ($(date -u +%F))" \
            -b "A tracked package bumped in Alpine but the wasm port build failed. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID -- fix the recipe (in the private source repo, then re-sync) and re-dispatch with force=<pkg>. The old version keeps serving meanwhile."
